[project]
name = "knotic-python-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["backend/tests", "mcp/tests", "packages/config/tests"]
markers = ["integration: requires local PostgreSQL or Redis infrastructure"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["backend/src", "mcp/src", "packages/config/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
packages = ["knotic_api", "knotic_mcp", "knotic_config"]
mypy_path = ["backend/src", "mcp/src", "packages/config/src"]

[tool.uv]
package = false
required-version = "==0.12.2"
python-preference = "managed"

[tool.uv.audit]
malware-check = true

[tool.uv.workspace]
members = ["backend", "mcp", "packages/config"]
