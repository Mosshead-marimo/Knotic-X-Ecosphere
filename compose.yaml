name: knotic-sales-agent

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - application
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app-environment: &app-environment
  KNOTIC_ENV: development
  KNOTIC_LOG_LEVEL: INFO
  KNOTIC_DEBUG: "false"
  KNOTIC_DATABASE_URL: postgresql://knotic@postgres:5432/knotic
  KNOTIC_REDIS_URL: redis://redis:6379/0
  KNOTIC_MCP_AUTH_TOKEN: local-only-public-sentinel-token-0000000000000001

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: knotic
      POSTGRES_USER: knotic
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knotic -d knotic"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  redis:
    image: redis:8.8.1@sha256:3eafabb4c93fcb8b36b666e07a43f096cb157bc6b07dce4b2492b895c63cf37f
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}

  mcp:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/mcp.Dockerfile
    environment:
      <<: *app-environment
      KNOTIC_MCP_HOST: 0.0.0.0
      KNOTIC_MCP_PORT: "8090"
      KNOTIC_MCP_ALLOWED_HOSTS: '["mcp"]'
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks: [application, data]
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 512M}

  backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      <<: *app-environment
      KNOTIC_BACKEND_HOST: 0.0.0.0
      KNOTIC_BACKEND_PORT: "8080"
      KNOTIC_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      KNOTIC_MCP_BASE_URL: http://mcp:8090
      KNOTIC_AGORA_APP_ID: local-only-public-agora-app-id-0001
      KNOTIC_AGORA_APP_CERTIFICATE: local-only-public-agora-certificate-0000000001
      KNOTIC_SESSION_SECURITY_KEY: local-only-public-session-key-00000000000001
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mcp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks: [application, data]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}

  events-api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["gunicorn", "--bind=0.0.0.0:8081", "--workers=2", "--threads=16", "--timeout=35", "--no-control-socket", "knotic_api.app:create_app()"]
    environment:
      <<: *app-environment
      KNOTIC_BACKEND_HOST: 0.0.0.0
      KNOTIC_BACKEND_PORT: "8081"
      KNOTIC_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      KNOTIC_MCP_BASE_URL: http://mcp:8090
      KNOTIC_AGORA_APP_ID: local-only-public-agora-app-id-0001
      KNOTIC_AGORA_APP_CERTIFICATE: local-only-public-agora-certificate-0000000001
      KNOTIC_SESSION_SECURITY_KEY: local-only-public-session-key-00000000000001
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mcp: {condition: service_healthy}
    networks: [application, data]
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 512M}

  event-relay:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["knotic-event-relay"]
    environment:
      <<: *app-environment
      KNOTIC_MCP_BASE_URL: http://mcp:8090
      KNOTIC_AGORA_APP_ID: local-only-public-agora-app-id-0001
      KNOTIC_AGORA_APP_CERTIFICATE: local-only-public-agora-certificate-0000000001
      KNOTIC_SESSION_SECURITY_KEY: local-only-public-session-key-00000000000001
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [application, data]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  frontend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      EVENTS_INTERNAL_URL: http://events-api:8081
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      backend: {condition: service_healthy}
      events-api: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 512M}

networks:
  application:
    internal: false
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
