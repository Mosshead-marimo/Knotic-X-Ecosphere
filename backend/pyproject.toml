[project]
name = "knotic-api"
version = "0.0.0"
description = "Flask API and LangGraph orchestration service for Knotic Sales Agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.0",
    "cryptography==50.0.0",
    "flask==3.1.3",
    "gunicorn==26.0.0",
    "knotic-config==0.0.0",
    "langgraph==1.2.11",
    "mcp==2.0.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pgvector==0.5.0",
    "psycopg[binary,pool]==3.3.4",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "redis[hiredis]==8.1.0",
    "sqlalchemy==2.0.52",
    "openai==3.3.1",
]

[project.scripts]
knotic-api = "knotic_api.__main__:main"
knotic-evaluate = "knotic_api.workflow.evaluation:main"
knotic-certify-voice = "knotic_api.voice.certification:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.sources]
knotic-config = { workspace = true }
