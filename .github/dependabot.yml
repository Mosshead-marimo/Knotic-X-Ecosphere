version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      frontend-production:
        dependency-type: production
        update-types:
          - patch
          - minor
      frontend-development:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      python-production:
        dependency-type: production
        update-types:
          - patch
          - minor
      python-development:
        dependency-type: development
        update-types:
          - patch
          - minor

