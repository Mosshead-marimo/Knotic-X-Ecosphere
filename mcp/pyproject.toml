[project]
name = "knotic-mcp"
version = "0.0.0"
description = "MCP gateway and tools for Knotic Sales Agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "knotic-config==0.0.0",
    "mcp==2.0.0",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.3",
]

[project.scripts]
knotic-mcp = "knotic_mcp.__main__:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.sources]
knotic-config = { workspace = true }
